name: Не давать базе уснуть

# Бесплатный проект Supabase останавливается после недели простоя, и сайт
# перестаёт пускать людей до ручного нажатия «Restore» в панели. Один запрос
# раз в трое суток считается активностью и снимает вопрос.
#
# Важно: GitHub отключает расписания в репозиториях, где 60 дней не было
# коммитов. Если проект надолго замрёт, задание придётся включить обратно
# кнопкой на вкладке Actions.

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Не заданы NEXT_PUBLIC_SUPABASE_URL или NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          # Запрос идёт в саму таблицу, а не в служебный адрес: активностью
          # считается обращение к Postgres, а не к api-шлюзу
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/profiles?select=id&limit=1")

          echo "Ответ базы: HTTP $code"
          cat /tmp/out.txt

          if [ "$code" != "200" ]; then
            echo "::error::База не ответила как ожидалось — возможно, проект уже на паузе"
            exit 1
          fi
